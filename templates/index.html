<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конвертер валют</title>
  <style>
    :root { --bg:#f4f6f9; --card:#fff; --text:#1c2230; --muted:#667085; --accent:#0f766e; --err:#b42318; --warn-bg:#fff7e6; --warn:#8a5a00; --border:#d7dce4; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:560px; margin:40px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { font-size:22px; margin:0 0 18px; }
    label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
    input, select, button { font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--border); background:#fff; width:100%; }
    .row { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:end; }
    #swap { width:auto; padding:10px 12px; cursor:pointer; }
    #convert { margin-top:18px; background:var(--accent); color:#fff; border:none; cursor:pointer; }
    #convert:disabled { background:#a3b3b1; cursor:not-allowed; }
    .field-error { color:var(--err); font-size:13px; min-height:18px; margin-top:4px; }
    .banner { display:none; margin-bottom:14px; padding:10px 12px; border-radius:8px; font-size:14px; }
    .banner.warn { display:block; background:var(--warn-bg); color:var(--warn); }
    .banner.error { display:block; background:#fdecea; color:var(--err); }
    #result { margin-top:20px; font-size:24px; font-weight:600; min-height:30px; }
    #meta { color:var(--muted); font-size:13px; margin-top:6px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Конвертер валют</h1>
    <div id="banner" class="banner" role="status"></div>

    <label for="amount">Сумма</label>
    <input id="amount" inputmode="decimal" placeholder="например, 100 или 150,50" autocomplete="off">
    <div id="amount-error" class="field-error"></div>

    <div class="row">
      <div><label for="from">Из валюты</label><select id="from"></select></div>
      <button id="swap" type="button" title="Поменять местами" aria-label="Поменять валюты местами">⇄</button>
      <div><label for="to">В валюту</label><select id="to"></select></div>
    </div>

    <label for="date">Дата курса</label>
    <input id="date" type="date">
    <div id="date-error" class="field-error"></div>

    <button id="convert" disabled>Конвертировать</button>
    <div id="result" aria-live="polite"></div>
    <div id="meta"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const amount = $("amount"), from = $("from"), to = $("to"), date = $("date"), btn = $("convert");
const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
date.value = today; date.max = today;
let ratesOk = false;

// Клиентская проверка только для UX; сервер проверяет всё повторно.
function amountError(v) {
  const s = v.replace(/[\s ]/g, "").replace(",", ".");
  if (!s) return "Введите сумму.";
  if (!/^\d*\.?\d+$/.test(s)) return "Сумма должна содержать только цифры и десятичный разделитель.";
  if (parseFloat(s) <= 0) return "Сумма должна быть строго больше нуля.";
  return "";
}
function refresh(showEmpty) {
  const err = amountError(amount.value);
  $("amount-error").textContent = (amount.value || showEmpty) ? err : "";
  btn.disabled = !(ratesOk && !err && from.value && to.value && date.value);
}
function banner(kind, text) {
  $("banner").className = "banner" + (text ? " " + kind : "");
  $("banner").textContent = text || "";
}
function showMeta(r) {
  $("meta").textContent = `Курс от ${r.date} · Источник: ${r.source}` + (r.offline ? " · сохранённые данные" : "");
  banner("warn", r.notice);
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || "Ошибка");
  return body;
}

async function loadRates() {
  $("date-error").textContent = "";
  ratesOk = false; refresh();
  try {
    const r = await api("/api/rates?date=" + date.value);
    const keep = [from.value || "EUR", to.value || "MDL"];
    for (const sel of [from, to]) {
      sel.replaceChildren(...r.currencies.map(c => new Option(`${c.code} — ${c.name}`, c.code)));
    }
    from.value = keep[0]; to.value = keep[1];
    if (!from.value) from.selectedIndex = 0;
    if (!to.value) to.selectedIndex = 0;
    ratesOk = true;
    showMeta(r);
  } catch (e) {
    banner("error", e.message);
    $("meta").textContent = "";
  }
  refresh();
}

btn.addEventListener("click", async () => {
  try {
    const r = await api("/api/convert", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({amount: amount.value, from: from.value, to: to.value, date: date.value}),
    });
    $("result").textContent = `${r.amount} ${r.from_code} = ${r.result} ${r.to_code}`;
    showMeta(r);
    $("meta").textContent += ` · 1 ${r.from_code} = ${r.rate} ${r.to_code}`;
  } catch (e) {
    $("result").textContent = "";
    banner("error", e.message);
  }
});
$("swap").addEventListener("click", () => { [from.value, to.value] = [to.value, from.value]; refresh(); });
amount.addEventListener("input", () => refresh());
amount.addEventListener("keydown", e => { if (e.key === "Enter" && !btn.disabled) btn.click(); });
from.addEventListener("change", () => refresh());
to.addEventListener("change", () => refresh());
date.addEventListener("change", () => {
  if (!date.value || date.value > today) { $("date-error").textContent = "Выберите сегодняшнюю или прошедшую дату."; ratesOk = false; refresh(); return; }
  loadRates();
});
loadRates();
</script>
</body>
</html>
